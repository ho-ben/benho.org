function parseBS(sArg)
{
	var retStr;
	var wordlist = new Array();
	var s = sArg;

	var start = s.indexOf("[");
	var stop = s.indexOf("]");


	if( start < 0 | stop < 0 ) return s;


	var cur = start+1;
	var next;

	while( (next = s.indexOf("|",cur )) > 0 )
	{
		if( next > stop ) break;
		wordlist.push( s.substring(cur,next));
		cur = next+1;
	}
	wordlist.push( s.substring(cur,stop));

		//return(wordlist[0]);

	//retStr = "In: " + s.indexOf("|",11) + ": " + s;
	retStr = s.substring(0,start)
		+wordlist[(synNum+start) % wordlist.length]
		+s.substring(stop+1,s.length);

	//return ":" + synNum;


	return parseBS(retStr );
}

function changeBGdirect()
{
	if( !runbanner) return;

	if( backRed > 240 ) delBackRed = -1;
	if( backRed < 160 ) delBackRed = 1;
	if( backGreen > 240 ) delBackGreen = -1;

	backGreen = (backGreen + delBackGreen * getRand(12));

	document.getElementById("myTicker").style.fontSize= parseInt(document.getElementById("myTicker").style.fontSize) + getRand(7)-3;

}

function changeBG(e)

	}
	lastX = window.event.clientX;
	lastY = window.event.clientY;

	backTime = nowTime;

}
